<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StageCraft | Stand-Up Comedy & Live Show Management</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Sora',sans-serif;
  background:#0b0b0f;
  color:#fff;
  line-height:1.7;
}

/* COMMON */
.section{
  padding:100px 20px;
  max-width:1100px;
  margin:auto;
}
.center{text-align:center}

h1{font-size:56px;font-weight:700}
h2{font-size:42px;margin-bottom:20px;font-weight:600}

.fade{
  opacity:0;
  transform:translateY(40px);
  transition:1s ease;
}
.fade.show{
  opacity:1;
  transform:none;
}

/* HERO */
.hero{
  min-height:100vh;
  background:
  linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.9)),
  url("https://images.unsplash.com/photo-1518972559570-7cc1309f3229?auto=format&fit=crop&w=1600&q=80");
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.btn{
  padding:14px 34px;
  border:none;
  border-radius:30px;
  font-weight:600;
  cursor:pointer;
  margin-top:20px;
}

.primary{background:#6C5CE7;color:#fff}
.whatsapp{background:#25D366;color:#000}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:30px;
}

.card{
  background:#14141c;
  padding:30px;
  border-radius:16px;
  text-align:center;
}

/* IMAGE FIX (IMPORTANT PART) */
.card img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:15px;
}
