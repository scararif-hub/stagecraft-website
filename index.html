<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StageCraft</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#050505;
  color:#ffffff;
  font-family:'Inter', sans-serif;
}

/* HERO */
.hero{
  height:100vh;
  background:
    linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,.9)),
    url("https://images.unsplash.com/photo-1518972559570-7cc1309f3229?auto=format&fit=crop&w=1600&q=80");
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

.hero-content h1{
  font-family:'Bebas Neue', cursive;
  font-size:96px;
  letter-spacing:6px;
  animation:heroPop 1.2s ease forwards;
}

.hero-content p{
  font-size:20px;
  margin-top:12px;
  opacity:0;
  animation:fadeUp 1s ease forwards;
  animation-delay:.6s;
}

.hero-buttons{
  margin-top:30px;
  opacity:0;
  animation:fadeUp 1s ease forwards;
  animation-delay:1s;
}

.btn{
  padding:14px 36px;
  border-radius:40px;
  border:none;
  margin:8px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
}

.call{background:#ff9800;color:#000;}
.wa{background:#25D366;color:#000;}

.btn:hover{
  transform:scale(1.08);
}

/* Animations */
@keyframes heroPop{
  0%{transform:scale(.3);opacity:0;}
  70%{transform:scale(1.1);}
  100%{transform:scale(1);opacity:1;}
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(40px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<section class="hero">
  <div class="hero-content">
    <h1>STAGECRAFT</h1>
    <p>Crafting Comedy · Executing Live Shows</p>

    <div class="hero-buttons">
      <a href="tel:8861605754"><button class="btn call">CALL NOW</button></a>
      <a href="https://wa.me/918861605754"><button class="btn wa">WHATSAPP</button></a>
    </div>
  </div>
</section>

</body>
</html>
